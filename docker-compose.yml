name: orbit

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: orbit_redis
    volumes:
      - nv_redis:/data

  # Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: orbit-server:latest
    container_name: orbit_server
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./server/app:/app
      - /app/node_modules
    depends_on:
      - redis
    tty: true
    stdin_open: true
    command: sleep infinity

  # Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: orbit-client:latest
    container_name: orbit_client
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./client/app:/app
      - /app/node_modules
    depends_on:
      - server
    tty: true
    stdin_open: true
    command: sleep infinity

volumes:
  nv_redis:
