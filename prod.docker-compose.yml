services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: orbit_redis_prod
    volumes:
      - nv_redis:/data
    restart: unless-stopped

  # Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: orbit-server:${RELEASE_VERSION:-temp}
    container_name: orbit_server_prod
    restart: unless-stopped
    ports:
      - "18787:18787"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./server/app:/app
      - /app/node_modules
    depends_on:
      - redis
    tty: true
    stdin_open: true

  # Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: orbit-client:${RELEASE_VERSION:-temp}
    container_name: orbit_client_prod
    restart: unless-stopped
    ports:
      - "15173:15173"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./client/app:/app
      - /app/node_modules
    depends_on:
      - server
    tty: true
    stdin_open: true

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: orbit_tunnel_prod
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - client
      - server

volumes:
  nv_redis:
