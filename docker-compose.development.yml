name: orbit_development

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: orbit_redis_dev
    volumes:
      - nv_redis:/data

  # Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: orbit-server:development
    container_name: orbit_server_dev
    ports:
      - "8787:8787"
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    volumes:
      - ./server/app:/app
      - /app/node_modules
      - nv_realm:/app/.realm
    depends_on:
      - redis
    tty: true
    stdin_open: true
    command: sleep infinity

  # Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: orbit-client:development
    container_name: orbit_client_dev
    ports:
      - "5173:5173"
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    volumes:
      - ./client/app:/app
      - /app/node_modules
    depends_on:
      - server
    tty: true
    stdin_open: true
    command: sleep infinity

volumes:
  nv_redis:
  nv_realm:
