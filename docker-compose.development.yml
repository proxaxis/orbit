name: orbit_development

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: orbit_redis_dev
    volumes:
      - nv_redis:/data

  # Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: orbit-server:development
    container_name: orbit_server_dev
    ports:
      - "8787:8787"
    env_file:
      - .env.development
    volumes:
      - ./server/app:/app
      - /app/node_modules
      - nv_realm:/app/.realm
    depends_on:
      - redis
    tty: true
    stdin_open: true
#    command: sleep infinity

  # Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: orbit-client:development
    container_name: orbit_client_dev
    ports:
      - "5173:5173"
    env_file:
      - .env.development
    # 共有 env_file の NODE_ENV=production は BFF の必須変数検証用。
    # client は vite.config.js が NODE_ENV=production を 15173 扱いにするため、
    # 開発ポート 5173 で起動させるには development に戻す
    environment:
      - NODE_ENV=development
    volumes:
      - ./client/app:/app
      - /app/node_modules
    depends_on:
      - server
    tty: true
    stdin_open: true
#    command: sleep infinity

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    image: orbit-website:development
    container_name: orbit_website_dev
    ports:
      - "4321:4321"
    env_file:
      - .env.development
    volumes:
      - ./website/app:/app
      - /app/node_modules
    tty: true
    stdin_open: true
#    command: sleep infinity

  # Operation Agent
  orchestrator:
    image: proxaxis/orchestrator:latest
    container_name: orbit_orchestrator
    shm_size: "2gb"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/ws

volumes:
  nv_redis:
  nv_realm:
