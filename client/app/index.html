<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Calendar</title>
    <meta name="theme-color" content="#1f2937" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orbit Calendar" />
    <link rel="manifest" href="/manifest.default.webmanifest" />
    <meta name="description" content="Unify Your Tasks and Time. Execute with Focus." />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- OGP基本設定 -->
    <meta property="og:url" content="https://orbit.proxaxis.me" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orbit Calendar" />
    <meta property="og:description" content="Unify Your Tasks and Time. Execute with Focus." />
    <meta property="og:site_name" content="Orbit Calendar" />
    <meta property="og:image" content="https://orbit.proxaxis.me/ogp.png" /> <!-- 画像の絶対パス（1200×630px推奨） -->
    <meta property="og:locale" content="ja_JP" />

    <!-- X設定 -->
    <meta name="twitter:card" content="summary_large_image" /> <!-- 画像を大きく見せたい場合は summary_large_image -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
